<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>مونتاج — محرر فيديو</title>
<meta name="theme-color" content="#16181d">
<style>
:root{
  --bg:#111317; --panel:#1a1d23; --panel2:#22262e; --line:#2e333d; --text:#e8eaed; --mute:#8b93a1;
  --acc:#4f8cff; --acc2:#3a6fd6; --danger:#e5484d; --ok:#30a46c;
  --vclip:#3b6fb8; --iclip:#7a4fb8; --tclip:#b8783b; --aclip:#2f8f63;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri:hover{background:var(--acc2)}
button.icon{padding:6px 9px;min-width:34px}
button:disabled{opacity:.4;cursor:default}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=color]{width:40px;height:28px;border:1px solid var(--line);background:none;border-radius:6px;padding:0}
#app{display:grid;height:100%;grid-template-rows:auto minmax(0,1fr) auto minmax(150px,38%);grid-template-columns:260px minmax(0,1fr) 280px;
  grid-template-areas:"top top top" "bin view props" "bin ctrl props" "tl tl tl"}
header{grid-area:top;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0 0 0 10px}
header .sp{flex:1}
.panel{background:var(--panel);overflow:auto;min-height:0}
#bin{grid-area:bin;border-left:1px solid var(--line);padding:8px}
#props{grid-area:props;border-right:1px solid var(--line);padding:8px}
.ph{font-weight:600;color:var(--mute);font-size:12px;margin:2px 0 8px;display:flex;justify-content:space-between;align-items:center}
#drop{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--mute);cursor:pointer;margin-bottom:8px}
#drop.over{border-color:var(--acc);color:var(--text)}
.media{display:flex;gap:8px;align-items:center;padding:5px;border-radius:8px;border:1px solid transparent;cursor:grab;margin-bottom:4px;background:var(--panel2)}
.media:hover{border-color:var(--line)}
.media .th{width:64px;height:38px;border-radius:5px;background:#000 center/cover no-repeat;flex:none;display:grid;place-items:center;font-size:18px}
.media .nm{flex:1;min-width:0;font-size:12px}
.media .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.media .nm span{color:var(--mute)}
#view{grid-area:view;display:grid;place-items:center;padding:10px;min-height:0;background:#0b0c0f}
#canvasWrap{position:relative;max-width:100%;max-height:100%;aspect-ratio:16/9;background:#000;box-shadow:0 4px 30px #0008}
#cv{display:block;width:100%;height:100%;touch-action:none}
#ctrl{grid-area:ctrl;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap}
#tc{font-variant-numeric:tabular-nums;font-family:ui-monospace,Consolas,monospace;min-width:150px;text-align:center;direction:ltr}
#tl{grid-area:tl;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);min-height:0}
#tlbar{display:flex;gap:6px;align-items:center;padding:5px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#tlbar .sp{flex:1}
#tlbody{flex:1;display:flex;direction:ltr;min-height:0;overflow:hidden}
#heads{width:70px;flex:none;border-right:1px solid var(--line);overflow:hidden}
#heads .rh{height:22px}
.th2{height:56px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mute)}
.th2 button{padding:0 5px;font-size:11px;border-radius:4px}
.th2.audio{height:44px}
#scroll{flex:1;overflow:auto;position:relative}
#lane{position:relative;min-height:100%}
#ruler{height:22px;position:sticky;top:0;z-index:5;background:var(--panel2);border-bottom:1px solid var(--line);cursor:col-resize}
.track{height:56px;border-bottom:1px solid var(--line);position:relative;background:repeating-linear-gradient(90deg,transparent 0 99px,#ffffff06 99px 100px)}
.track.audio{height:44px}
.track.dropover{background:#4f8cff22}
.clip{position:absolute;top:3px;bottom:3px;border-radius:6px;overflow:hidden;cursor:grab;border:1px solid #0006;color:#fff;font-size:11px;touch-action:none;user-select:none}
.clip.video{background:var(--vclip)} .clip.image{background:var(--iclip)} .clip.text{background:var(--tclip)} .clip.audio{background:var(--aclip)}
.clip.sel{outline:2px solid #fff;z-index:2}
.clip .lbl{position:absolute;top:2px;left:6px;right:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000;pointer-events:none;z-index:1}
.clip .strip{position:absolute;inset:0;background-repeat:repeat-x;background-size:auto 100%;opacity:.55;pointer-events:none}
.clip canvas{position:absolute;left:0;bottom:0;width:100%;height:60%;pointer-events:none;opacity:.8}
.clip .h{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;z-index:3}
.clip .h.l{left:0;border-left:3px solid #fff8} .clip .h.r{right:0;border-right:3px solid #fff8}
.trn{position:absolute;top:14px;bottom:14px;z-index:4;border-radius:5px;background:repeating-linear-gradient(135deg,#0002 0 5px,#0000 5px 10px),#ffd60ad9;color:#000;display:grid;place-items:center;font-size:12px;cursor:pointer;border:1px solid #000a;min-width:14px}
.track.audio .trn{top:10px;bottom:10px}
.trn.add{width:20px;height:20px;top:auto;bottom:3px;border-radius:50%;opacity:0;font-weight:bold;background:#ffd60a;transition:opacity .15s}
.track:hover .trn.add{opacity:.95}
@media (hover:none){.trn.add{opacity:.85}}
#saveSt{color:var(--mute);font-size:12px}
.clip .fade{position:absolute;top:0;height:100%;pointer-events:none;z-index:1}
#playhead{position:absolute;top:0;bottom:0;width:2px;background:#ff4d4d;z-index:6;pointer-events:none}
#playhead::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top:9px solid #ff4d4d}
#snapline{position:absolute;top:0;bottom:0;width:1px;background:#ffd60a;z-index:6;pointer-events:none;display:none}
.row{margin-bottom:9px}
.row label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
.row .val{float:left;color:var(--text);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sec{border-top:1px solid var(--line);margin:12px 0 8px;padding-top:8px;font-weight:600;font-size:12px;color:var(--acc)}
.empty{color:var(--mute);font-size:13px;padding:14px 4px;text-align:center}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:8px}
#modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:50}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(420px,92vw)}
#modal h3{margin:0 0 12px}
.bar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000d;padding:8px 16px;border-radius:8px;display:none;z-index:60}
#tabs{display:none}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
/* موبايل */
@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto minmax(110px,1fr) minmax(170px,34%);
    grid-template-areas:"top" "view" "ctrl" "tabs" "side" "tl"}
  #view{padding:6px;height:30vh}
  header{gap:5px;padding:5px 6px}
  header button,header select{padding:5px 7px}
  #selFps{display:none}
  #tabs{grid-area:tabs;display:flex;background:var(--panel);border-top:1px solid var(--line)}
  #tabs button{flex:1;border-radius:0;border:0;border-bottom:2px solid transparent;background:none}
  #tabs button.on{border-bottom-color:var(--acc);color:var(--acc)}
  #bin,#props{grid-area:side;border:0}
  #app[data-tab=bin] #props,#app[data-tab=props] #bin{display:none}
  header h1{font-size:14px}
  .hide-m{display:none}
}
</style>
</head>
<body>
<div id="app" data-tab="bin">
  <header>
    <h1>🎬 مونتاج</h1>
    <button id="bImport" class="pri">＋ استيراد</button>
    <button id="bText">T نص</button>
    <button id="bNew" title="مشروع جديد">🗋 جديد</button>
    <button id="bUndo" class="icon" title="تراجع (Ctrl+Z)">↶</button>
    <button id="bRedo" class="icon" title="إعادة (Ctrl+Y)">↷</button>
    <span id="saveSt"></span>
    <span class="sp"></span>
    <select id="selRes" title="مقاس الفيديو" style="width:auto">
      <option value="1920x1080">١٦:٩ — 1080p</option>
      <option value="1280x720" selected>١٦:٩ — 720p</option>
      <option value="1080x1920">٩:١٦ — ستوري/ريلز</option>
      <option value="720x1280">٩:١٦ — 720</option>
      <option value="1080x1080">١:١ — مربّع</option>
      <option value="1080x1350">٤:٥ — منشور</option>
    </select>
    <select id="selFps" title="عدد الإطارات" style="width:auto"><option>24</option><option selected>30</option><option>60</option></select>
    <button id="bExport" class="pri">⬇ تصدير</button>
    <input type="file" id="file" multiple accept="video/*,image/*,audio/*" hidden>
  </header>

  <aside id="bin" class="panel">
    <div id="drop">📂 اسحب ملفات الفيديو والصور والصوت لهون<br><small>أو اضغط للاختيار</small></div>
    <div class="ph">المكتبة <span id="binCount"></span></div>
    <div id="binList"></div>
    <div class="empty" id="binEmpty">ما في ملفات لسا.<br>اضغط على الملف أو اسحبه للخط الزمني.</div>
  </aside>

  <main id="view"><div id="canvasWrap"><canvas id="cv"></canvas></div></main>

  <div id="ctrl" dir="ltr">
    <button class="icon" id="bStart" title="البداية (Home)">⏮</button>
    <button class="icon" id="bPrevF" title="إطار للخلف (←)">◀︎|</button>
    <button class="icon pri" id="bPlay" title="تشغيل/إيقاف (Space)">▶</button>
    <button class="icon" id="bNextF" title="إطار للأمام (→)">|▶︎</button>
    <button class="icon" id="bEnd" title="النهاية (End)">⏭</button>
    <span id="tc">00:00:00.00 / 00:00:00.00</span>
  </div>

  <nav id="tabs"><button data-t="bin" class="on">📂 المكتبة</button><button data-t="props">🎛 الخصائص</button></nav>

  <aside id="props" class="panel"><div class="ph">الخصائص</div><div id="propBody"></div></aside>

  <section id="tl">
    <div id="tlbar">
      <button id="bSplit" title="قص عند المؤشر (S)">✂ قص</button>
      <button id="bDel" title="حذف (Delete)">🗑 حذف</button>
      <button id="bDup" title="نسخ (Ctrl+D)">⧉ تكرار</button>
      <button id="bRipple" title="حذف المقطع وسحب اللي بعده">⇤ حذف مع السحب</button>
      <label class="chk hide-m" style="margin:0"><input type="checkbox" id="chkSnap" checked> مغناطيس</label>
      <span class="sp"></span>
      <button id="bAddV" class="hide-m">＋ مسار فيديو</button>
      <button id="bAddA" class="hide-m">＋ مسار صوت</button>
      <button class="icon" id="bZo" title="تصغير">－</button>
      <input type="range" id="zoom" min="5" max="400" value="60" style="width:110px">
      <button class="icon" id="bZi" title="تكبير">＋</button>
      <button id="bFit" title="ملاءمة">⇔</button>
    </div>
    <div id="tlbody">
      <div id="heads"><div class="rh"></div><div id="headList"></div></div>
      <div id="scroll"><div id="lane"><canvas id="ruler"></canvas><div id="tracks"></div><div id="playhead"></div><div id="snapline"></div></div></div>
    </div>
  </section>
</div>

<div id="modal"><div class="box">
  <h3>⬇ تصدير الفيديو</h3>
  <div id="expSetup">
    <div class="row"><label>الجودة</label>
      <select id="expQ"><option value="2500000">عادية — ملف أصغر</option><option value="6000000" selected>عالية</option><option value="12000000">عالية جداً</option></select></div>
    <div class="row"><label>الصيغة</label><select id="expFmt"></select></div>
    <p style="color:var(--mute);font-size:12px">التصدير بيصير بنفس سرعة التشغيل. خلّي الصفحة مفتوحة وقدّامك لحتى يخلص.</p>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button id="expCancel0">إلغاء</button><button class="pri" id="expGo">ابدأ التصدير</button></div>
  </div>
  <div id="expRun" style="display:none">
    <div id="expMsg">جاري التصدير…</div>
    <div class="bar"><i id="expBar"></i></div>
    <div style="display:flex;justify-content:flex-end"><button id="expCancel">إيقاف</button></div>
  </div>
</div></div>
<div id="toast"></div>

<script>
'use strict';
// ====================== أدوات ======================
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Math.random().toString(36).slice(2, 10);
const fmt = (t, frames) => {
  t = Math.max(0, t);
  const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = Math.floor(t) % 60, f = Math.floor((t % 1) * 100);
  const p = n => String(n).padStart(2, '0');
  return (h ? p(h) + ':' : '00:') + p(m) + ':' + p(s) + (frames === false ? '' : '.' + p(f));
};
function toast(msg, ms = 2200) { const el = $('#toast'); el.textContent = msg; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', ms); }

// ====================== الحالة ======================
const S = {
  W: 1280, H: 720, fps: 30,
  media: [],                 // {id,name,type,url,duration,w,h,thumb,img,peaks,strip}
  tracks: [ {id:'v2', type:'video', name:'V2'}, {id:'v1', type:'video', name:'V1'}, {id:'a1', type:'audio', name:'A1'} ],
  clips: [],
  sel: null, t: 0, playing: false, pps: 60,
};
const hidden = {};           // مسارات مخفية/مكتومة: id -> {hide,mute}
const undoStack = [], redoStack = [];
const snapState = () => JSON.stringify({ clips: S.clips, tracks: S.tracks, sel: S.sel });
function commit() { undoStack.push(snapState()); if (undoStack.length > 200) undoStack.shift(); redoStack.length = 0; updUndo(); }
function restore(js) { const o = JSON.parse(js); S.clips = o.clips; S.tracks = o.tracks; S.sel = o.sel; renderAll(); }
function undo() { if (!undoStack.length) return; redoStack.push(snapState()); restore(undoStack.pop()); updUndo(); }
function redo() { if (!redoStack.length) return; undoStack.push(snapState()); restore(redoStack.pop()); updUndo(); }
function updUndo() { $('#bUndo').disabled = !undoStack.length; $('#bRedo').disabled = !redoStack.length; }

const mediaById = id => S.media.find(m => m.id === id);
const clipById = id => S.clips.find(c => c.id === id);
const trackById = id => S.tracks.find(t => t.id === id);
const selClip = () => clipById(S.sel);
const projectDur = () => S.clips.reduce((a, c) => Math.max(a, c.start + c.dur), 0);
const TRANS = [['dissolve', 'ذوبان'], ['black', 'عبر الأسود'], ['white', 'وميض أبيض'], ['slide', 'دفع لليسار'], ['slideR', 'دفع لليمين'], ['wipe', 'مسح'], ['circle', 'دائرة'], ['zoom', 'زوم']];
const EPS = 0.05;
const prevAdj = c => S.clips.find(o => o !== c && o.track === c.track && Math.abs(o.start + o.dur - c.start) < EPS);
const nextAdj = c => S.clips.find(o => o !== c && o.track === c.track && Math.abs(c.start + c.dur - o.start) < EPS);
// مدة الانتقال الداخل على المقطع (من المقطع اللي قبله) — بيصير على آخر جزء من المقطع السابق
function tIn(c) { if (!c.trans || !(c.trans.dur > 0)) return 0; const p = prevAdj(c); return p ? Math.min(c.trans.dur, p.dur, c.dur) : 0; }
function transOut(c) { const n = nextAdj(c); const d = n ? tIn(n) : 0; return d ? { d, type: n.trans.type } : null; }
const defFilters = () => ({ brightness: 100, contrast: 100, saturate: 100, hue: 0, grayscale: 0, sepia: 0, blur: 0, invert: 0 });

// ====================== الصوت ======================
let AC = null, master = null, expDest = null;
function audio() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
const els = {};              // clipId -> {el, gain}
function ensureEl(c) {
  if (els[c.id]) return els[c.id];
  if (c.kind !== 'video' && c.kind !== 'audio') return null;
  const m = mediaById(c.mediaId); if (!m) return null;
  const el = document.createElement(c.kind === 'video' ? 'video' : 'audio');
  el.src = m.url; el.preload = 'auto'; el.playsInline = true; el.crossOrigin = 'anonymous';
  el.addEventListener('seeked', () => needDraw = true);
  el.addEventListener('loadeddata', () => needDraw = true);
  let gain = null;
  try { audio(); const src = AC.createMediaElementSource(el); gain = AC.createGain(); src.connect(gain).connect(master); } catch (e) { console.warn(e); }
  return els[c.id] = { el, gain };
}
function gcEls() {
  for (const id in els) if (!clipById(id)) { const e = els[id]; e.el.pause(); e.el.removeAttribute('src'); e.el.load(); if (e.gain) e.gain.disconnect(); delete els[id]; }
}

// ====================== الاستيراد ======================
async function importFiles(files) {
  audio();
  for (const f of files) {
    const type = f.type.startsWith('video') ? 'video' : f.type.startsWith('image') ? 'image' : f.type.startsWith('audio') ? 'audio' : null;
    if (!type) { toast('نوع ملف غير مدعوم: ' + f.name); continue; }
    const m = { id: uid(), name: f.name, type, url: URL.createObjectURL(f), duration: 5, w: 0, h: 0, thumb: '', peaks: null, strip: '' };
    try {
      if (type === 'image') {
        const img = new Image(); img.src = m.url; await img.decode();
        m.img = img; m.w = img.naturalWidth; m.h = img.naturalHeight; m.thumb = m.url; m.strip = m.url;
      } else {
        const el = document.createElement(type);
        el.preload = 'auto'; el.muted = true; el.src = m.url;
        await new Promise((ok, no) => { el.onloadedmetadata = ok; el.onerror = () => no(new Error('ما قدرت افتح الملف')); });
        m.duration = isFinite(el.duration) ? el.duration : 10;
        if (type === 'video') {
          m.w = el.videoWidth; m.h = el.videoHeight;
          const shots = await thumbs(el, m);
          m.thumb = shots[0] || ''; m.strip = shots.length ? stripImage(shots) : '';
        }
      }
      S.media.push(m); renderBin();
      idbPut('files', m.id, f).catch(() => toast('⚠ ما في مساحة كافية لحفظ ' + f.name + ' بالمشروع', 4000));
      if (type !== 'image') peaksFor(f, m);
    } catch (e) { toast('خطأ بالملف ' + f.name + ': ' + e.message); }
  }
}
async function thumbs(el, m) {
  const out = []; const c = document.createElement('canvas'); c.height = 72; c.width = Math.round(72 * (m.w / m.h || 16 / 9));
  const x = c.getContext('2d');
  const n = 6;
  for (let i = 0; i < n; i++) {
    const t = Math.min(m.duration - 0.05, m.duration * (i + 0.5) / n);
    await new Promise(r => { el.onseeked = r; el.currentTime = Math.max(0, t); setTimeout(r, 1500); });
    try { x.drawImage(el, 0, 0, c.width, c.height); out.push(c.toDataURL('image/jpeg', .6)); } catch (e) {}
  }
  return out;
}
function stripImage(shots) {
  // صورة واحدة فيها كل اللقطات جنب بعض
  const c = document.createElement('canvas'); const imgs = shots.map(s => { const i = new Image(); i.src = s; return i; });
  return Promise.all(imgs.map(i => i.decode())).then(() => {
    c.width = imgs.reduce((a, i) => a + i.width, 0); c.height = imgs[0].height;
    let x = 0; const g = c.getContext('2d'); imgs.forEach(i => { g.drawImage(i, x, 0); x += i.width; });
    return c.toDataURL('image/jpeg', .6);
  });
}
async function peaksFor(file, m) {
  try {
    if (file.size > 400e6) return;
    const buf = await file.arrayBuffer();
    const ab = await new OfflineAudioContext(1, 1, 44100).decodeAudioData(buf);

  if (!hit) { return; }
  if (S.sel !== hit.id) { S.sel = hit.id; renderTracks(); renderProps(); }
  cv.setPointerCapture(e.pointerId); cvDrag = { c: hit, p, x: hit.x, y: hit.y, before: snapState(), moved: false }; needDraw = true;
});
cv.addEventListener('pointermove', e => {
  if (!cvDrag) return; const p = cvPoint(e), c = cvDrag.c;
  c.x = cvDrag.x + (p.x - cvDrag.p.x) / S.W; c.y = cvDrag.y + (p.y - cvDrag.p.y) / S.H;
  if (Math.abs(c.x - .5) < 0.01) c.x = .5; if (Math.abs(c.y - .5) < 0.01) c.y = .5; // مغناطيس للمنتصف
  cvDrag.moved = true; needDraw = true;
});
cv.addEventListener('pointerup', () => { if (cvDrag?.moved) { undoStack.push(cvDrag.before); redoStack.length = 0; updUndo(); renderProps(); } cvDrag = null; });
cv.addEventListener('wheel', e => { const c = selClip(); if (!c || c.kind === 'audio') return; e.preventDefault(); c.scale = clamp(c.scale * (e.deltaY < 0 ? 1.05 : 0.95), 0.1, 3); needDraw = true; clearTimeout(cv.wt); cv.wt = setTimeout(renderProps, 200); }, { passive: false });

// ====================== التصدير ======================
let exporting = false, recorder = null, chunks = [], expCancelled = false;
function formats() {
  const list = [
    ['video/mp4;codecs="avc1.640028,mp4a.40.2"', 'MP4 (H.264)', 'mp4'], ['video/mp4;codecs=avc1,opus', 'MP4 (H.264)', 'mp4'], ['video/mp4', 'MP4', 'mp4'],
    ['video/webm;codecs=vp9,opus', 'WebM (VP9)', 'webm'], ['video/webm;codecs=vp8,opus', 'WebM (VP8)', 'webm'], ['video/webm', 'WebM', 'webm'],
  ];
  const seen = new Set();
  return list.filter(([m, l]) => window.MediaRecorder && MediaRecorder.isTypeSupported(m) && !seen.has(l) && seen.add(l));
}
$('#bExport').onclick = () => {
  if (!projectDur()) return toast('الخط الزمني فاضي');
  if (!window.MediaRecorder || !cv.captureStream) return toast('متصفحك ما بيدعم التصدير، جرّب Chrome');
  const f = formats(); $('#expFmt').innerHTML = f.map(([m, l, x], i) => `<option value="${i}">${l}</option>`).join('');
  $('#expSetup').style.display = ''; $('#expRun').style.display = 'none'; $('#modal').style.display = 'grid';
};
$('#expCancel0').onclick = () => $('#modal').style.display = 'none';
$('#expGo').onclick = async () => {
  const [mime, , ext] = formats()[+$('#expFmt').value] || [];
  audio(); if (S.playing) pause();
  S.sel = null; renderTracks(); renderProps();
  if (!expDest) { expDest = AC.createMediaStreamDestination(); master.connect(expDest); }
  const vs = cv.captureStream(S.fps);
  const stream = new MediaStream([...vs.getVideoTracks(), ...expDest.stream.getAudioTracks()]);
  chunks = []; expCancelled = false;
  try { recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: +$('#expQ').value, audioBitsPerSecond: 192000 }); }
  catch (e) { recorder = new MediaRecorder(stream); }
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    vs.getTracks().forEach(t => t.stop());
    exporting = false; $('#modal').style.display = 'none';
    if (expCancelled) return toast('انلغى التصدير');
    const blob = new Blob(chunks, { type: recorder.mimeType || mime });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'montaj-' + new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-') + '.' + (ext || 'webm'); a.click();
    toast('✔ خلص التصدير — ' + (blob.size / 1048576).toFixed(1) + ' MB', 4000);
  };
  $('#expSetup').style.display = 'none'; $('#expRun').style.display = ''; $('#expBar').style.width = '0';
  $('#expMsg').textContent = 'جاري التصدير… (' + fmt(projectDur(), false) + ')';
  // تجهيز أول لقطة
  S.t = 0; syncMedia(0, false); drawFrame(0);
  await new Promise(r => setTimeout(r, 400));
  exporting = true; recorder.start(500); play();
};
function finishExport() { pause(); if (recorder && recorder.state !== 'inactive') setTimeout(() => recorder.stop(), 150); }
$('#expCancel').onclick = () => { expCancelled = true; finishExport(); };

// ====================== الأزرار والاختصارات ======================
$('#bPlay').onclick = play;
$('#bStart').onclick = () => seek(0); $('#bEnd').onclick = () => seek(projectDur());
$('#bPrevF').onclick = () => seek(S.t - 1 / S.fps); $('#bNextF').onclick = () => seek(S.t + 1 / S.fps);
$('#bSplit').onclick = doSplit; $('#bDel').onclick = () => doDelete(false); $('#bRipple').onclick = () => doDelete(true); $('#bDup').onclick = doDup;
$('#bUndo').onclick = undo; $('#bRedo').onclick = redo;
$('#bText').onclick = () => { addToTimeline(null, S.t); if (innerWidth <= 860) setTab('props'); };
$('#bAddV').onclick = () => addTrack('video'); $('#bAddA').onclick = () => addTrack('audio');
$('#zoom').oninput = e => setZoom(+e.target.value);
$('#bZi').onclick = () => setZoom(S.pps * 1.4); $('#bZo').onclick = () => setZoom(S.pps / 1.4);
$('#bFit').onclick = () => { const d = projectDur(); if (d) { setZoom((scroll.clientWidth - 30) / d); scroll.scrollLeft = 0; } };
$('#selRes').onchange = e => setRes(e.target.value);
$('#selFps').onchange = e => S.fps = +e.target.value;
function setTab(t) { $('#app').dataset.tab = t; document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); }
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.t); };
tracksEl.addEventListener('dblclick', e => { if (e.target.closest('.clip') && innerWidth <= 860) setTab('props'); });
document.addEventListener('keydown', e => {
  if (exporting) return;
  const tag = e.target.tagName; if (tag === 'TEXTAREA' || (tag === 'INPUT' && e.target.type !== 'range' && e.target.type !== 'checkbox') || tag === 'SELECT') return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (k === ' ') { e.preventDefault(); play(); }
  else if (mod && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (mod && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
  else if (mod && k === 'd') { e.preventDefault(); doDup(); }
  else if (k === 's' || k === 'س') { e.preventDefault(); doSplit(); }
  else if (k === 'delete' || k === 'backspace') { e.preventDefault(); doDelete(e.shiftKey); }
  else if (k === 'arrowleft') { e.preventDefault(); seek(S.t - (e.shiftKey ? 1 : 1 / S.fps)); }
  else if (k === 'arrowright') { e.preventDefault(); seek(S.t + (e.shiftKey ? 1 : 1 / S.fps)); }
  else if (k === 'home') seek(0); else if (k === 'end') seek(projectDur());
  else if (k === 'escape') { S.sel = null; renderTracks(); renderProps(); needDraw = true; }
});
window.addEventListener('beforeunload', e => { if (!loading && projKey() !== lastSaved) { saveProject(); e.preventDefault(); e.returnValue = ''; } });
new ResizeObserver(() => { fitCanvas(); drawRuler(); }).observe($('#view'));

// ====================== حفظ المشروع (IndexedDB) ======================
let dbp = null;
function db() {
  return dbp ||= new Promise((ok, no) => {
    const r = indexedDB.open('montaj', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('files'); r.result.createObjectStore('kv'); };
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  });
}
async function idb(store, mode, fn) {
  const d = await db();
  return new Promise((ok, no) => { const tx = d.transaction(store, mode), req = fn(tx.objectStore(store)); tx.oncomplete = () => ok(req?.result); tx.onerror = tx.onabort = () => no(tx.error); });
}
const idbGet = (s, k) => idb(s, 'readonly', st => st.get(k));
const idbPut = (s, k, v) => idb(s, 'readwrite', st => st.put(v, k));
const idbDel = (s, k) => idb(s, 'readwrite', st => st.delete(k));
const idbClear = s => idb(s, 'readwrite', st => st.clear());

let lastSaved = '', loading = true, saving = false;
const setSaveSt = s => $('#saveSt').textContent = s;
const projKey = () => snapState() + '|' + $('#selRes').value + '|' + S.fps + JSON.stringify(hidden) + S.media.map(m => m.id + (typeof m.strip === 'string' ? 1 : 0)).join();
async function saveProject() {
  if (loading || saving || exporting) return;
  const k = projKey(); if (k === lastSaved) return;
  saving = true; setSaveSt('… جاري الحفظ');
  try {
    await idbPut('kv', 'project', {
      v: 1, res: $('#selRes').value, fps: S.fps, tracks: S.tracks, clips: S.clips, hidden, t: S.t, pps: S.pps,
      media: S.media.map(m => ({ id: m.id, name: m.name, type: m.type, duration: m.duration, w: m.w, h: m.h,
        thumb: m.type === 'video' ? m.thumb : '', strip: m.type === 'video' && typeof m.strip === 'string' ? m.strip : '' })),
    });
    lastSaved = k; setSaveSt('✔ محفوظ');
  } catch (e) { console.warn(e); setSaveSt('⚠ ما انحفظ'); }
  saving = false;
}
async function loadProject() {
  try {
    const p = await idbGet('kv', 'project');
    if (p && p.v === 1) {
      for (const mm of p.media) {
        const blob = await idbGet('files', mm.id); if (!blob) continue;
        const m = { ...mm, url: URL.createObjectURL(blob), peaks: null };
        if (m.type === 'image') { const img = new Image(); img.src = m.url; try { await img.decode(); } catch (e) { continue; } m.img = img; m.thumb = m.strip = m.url; }
        S.media.push(m); if (m.type !== 'image') peaksFor(blob, m);
      }
      S.tracks = p.tracks; S.clips = p.clips.filter(c => !c.mediaId || mediaById(c.mediaId));
      Object.assign(hidden, p.hidden || {});
      S.fps = p.fps || 30; $('#selFps').value = S.fps;
      if (p.res) { $('#selRes').value = p.res; setRes(p.res); }
      S.pps = p.pps || 60; $('#zoom').value = S.pps;
      renderBin(); renderAll(); seek(p.t || 0);
      if (S.clips.length || S.media.length) toast('✔ رجّعتلك آخر مشروع');
    }
  } catch (e) { console.warn(e); toast('ما قدرت افتح المشروع المحفوظ'); }
  loading = false; lastSaved = projKey(); setSaveSt(S.media.length ? '✔ محفوظ' : '');
}
setInterval(saveProject, 1500);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveProject(); });
$('#bNew').onclick = async () => {
  if ((S.clips.length || S.media.length) && !confirm('بدك تبلّش مشروع جديد؟ المشروع الحالي وملفاته رح ينمسحوا.')) return;
  if (S.playing) pause();
  S.media.forEach(m => URL.revokeObjectURL(m.url));
  S.media = []; S.clips = []; S.sel = null; S.t = 0;
  S.tracks = [{ id: 'v2', type: 'video', name: 'V2' }, { id: 'v1', type: 'video', name: 'V1' }, { id: 'a1', type: 'audio', name: 'A1' }];
  for (const k in hidden) delete hidden[k];
  undoStack.length = redoStack.length = 0; updUndo();
  await Promise.all([idbClear('files'), idbClear('kv')]).catch(() => {});
  renderBin(); renderAll(); updPlayhead(); lastSaved = projKey(); setSaveSt('');
};

setRes('1280x720'); renderBin(); renderAll(); updUndo(); requestAnimationFrame(loop);
navigator.storage?.persist?.().catch(() => {});
loadProject();
</script>
